<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 2560px;
            height: 1600px;
            overflow: hidden;
            background: #0f172a;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #e2e8f0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 48px;
            padding: 64px;
            height: 100%;
        }

        /* Left Column */
        .left-column {
            display: flex;
            flex-direction: column;
        }

        .timestamp {
            font-size: 10px;
            color: #64748b;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .artwork-container {
            flex: 0 0 auto;
            margin-bottom: 16px;
            text-align: center;
        }

        .artwork-image {
            max-height: calc(1600px / 3);
            max-width: calc(2560px / 3);
            object-fit: contain;
        }

        .artwork-filename {
            font-size: 9px;
            color: #64748b;
            margin-top: 12px;
            letter-spacing: 0.1em;
        }

        /* Right Column */
        .right-column {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
        }

        .heatmap-table {
            display: table;
        }

        .heatmap-row {
            display: table-row;
        }

        .heatmap-label,
        .heatmap-value {
            display: table-cell;
            padding: 12px 0;
            vertical-align: middle;
        }

        .heatmap-label {
            font-size: 10px;
            color: #94a3b8;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding-right: 24px;
        }

        .heatmap-squares {
            display: flex;
            gap: 2px;
        }

        .heatmap-square {
            width: 20px;
            height: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Left Column -->
        <div class="left-column">
            <div class="timestamp">{{ generated_at }}</div>

            <div class="artwork-container">
                <img src="file://{{ artwork_image_path }}"
                     alt="{{ artwork_filename }}"
                     class="artwork-image">
                <div class="artwork-filename">{{ artwork_filename }}</div>
            </div>
        </div>

        <!-- Second Column -->
        <div class="right-column">
            <div class="heatmap-table">
                <div class="heatmap-row">
                    <div class="heatmap-label">Commit Activity</div>
                    <div class="heatmap-value">
                        <div class="heatmap-squares">
                            {% for color in heatmap_colors %}
                            <div class="heatmap-square" style="background-color: {{ color }};"></div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                <div class="heatmap-row">
                    <div class="heatmap-label">Obs Edits</div>
                    <div class="heatmap-value">
                        <div class="heatmap-squares">
                            {% for color in obs_edits_colors %}
                            <div class="heatmap-square" style="background-color: {{ color }};"></div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Third Column: Random Project -->
        {% if random_project_image_path %}
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div class="timestamp">{{ random_project_name }}</div>
            <img src="file://{{ random_project_image_path }}"
                 alt="{{ random_project_name }}"
                 style="width: 100%; display: block; border-radius: 12px; object-fit: cover;">
        </div>
        {% endif %}
    </div>
</body>
</html>
